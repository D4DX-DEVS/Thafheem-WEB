name: Deploy Frontend

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build Vite project
      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      # Upload dist folder to server
      - name: Upload build files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 5317

          source: "dist"
          target: "/home/thafheem/uploads/"

          strip_components: 1
          overwrite: true
          debug: true
          timeout: 60s
          command_timeout: 10m

      # Deploy on server
      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 5317

          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            UPLOAD_PATH="/home/thafheem/uploads"

            echo "================================"
            echo "Starting Deployment"
            echo "================================"

            # Verify uploaded files exist
            if [ ! -d "$UPLOAD_PATH" ]; then
              echo "ERROR: Upload directory not found!"
              exit 1
            fi

            # Verify index.html exists
            if [ ! -f "$UPLOAD_PATH/index.html" ]; then
              echo "ERROR: index.html missing!"
              exit 1
            fi

            echo "✓ Build verified"

            # Create deploy path if missing
            mkdir -p "$DEPLOY_PATH"

            # Go to deploy path
            cd "$DEPLOY_PATH"

            # Backup .htaccess if exists
            if [ -f ".htaccess" ]; then
              cp .htaccess /tmp/.htaccess.backup
              echo "✓ .htaccess backed up"
            fi

            # Remove old frontend files
            rm -rf assets
            rm -rf fonts
            rm -rf articles

            rm -f index.html
            rm -f favicon.ico
            rm -f robots.txt
            rm -f manifest.json
            rm -f vite.svg
            rm -f service-worker.js

            echo "✓ Old files removed"

            # Copy new files
            cp -r "$UPLOAD_PATH"/* "$DEPLOY_PATH"/

            echo "✓ New files copied"

            # Restore .htaccess
            if [ -f /tmp/.htaccess.backup ]; then
              mv /tmp/.htaccess.backup .htaccess
              echo "✓ .htaccess restored"
            fi

            # Set permissions
            find "$DEPLOY_PATH" -type d -exec chmod 755 {} \;
            find "$DEPLOY_PATH" -type f -exec chmod 644 {} \;

            echo "✓ Permissions updated"

            # Cleanup uploads
            rm -rf /home/thafheem/uploads/*

            echo "================================"
            echo "✓ Deployment Successful"
            echo "================================"