  <path d="M256 140 C220 110 150 100 80 115 L55 135 L55 310 L80 295 C150 280 220 290 256 320 C292 290 362 280 432 295 L457 310 L457 135 L432 115 C362 100 292 110 256 140 Z" stroke="currentColor" stroke-width="22" stroke-linejoin="round" fill="white"/>
