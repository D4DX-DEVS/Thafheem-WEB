  <line x1="95" y1="205" x2="232" y2="200" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
  <line x1="93" y1="240" x2="232" y2="237" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
  <!-- Right page lines -->
  <line x1="277" y1="165" x2="412" y2="170" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
